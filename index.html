<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF & Image Master | ไปรษณีย์ไทย</title>
    <style>
        /* ปรับให้ลื่นไหลและรองรับการแสดงผลเต็มหน้าจอ */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #f8fafc; 
        }
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
            display: block;
        }
    </style>
</head>
<body>
    <iframe 
        id="mainApp"
        src="https://script.google.com/macros/s/AKfycbz-iAMVN_2ZTwu2gJKWgNRtq2s06CRmBX9nWfAsbCwKdEKkn5Vg2LVP90Mly-5GywCK/exec"
        allow="geolocation; microphone; camera; clipboard-read; clipboard-write; fullscreen"
        sandbox="allow-top-navigation allow-scripts allow-popups allow-forms allow-same-origin allow-downloads"
    ></iframe>

    <script>
        // Logic: บังคับให้ iframe รีโหลดตัวเองหรือช่วยโฟกัสหน้าเว็บเพื่อให้ใช้งานได้ราบรื่น
        const iframe = document.getElementById('mainApp');

        // ตรวจสอบเมื่อโหลดเสร็จ ให้โฟกัสไปที่เนื้อหาข้างในทันที
        iframe.onload = function() {
            console.log("PDF & Image Master Apps Script Loaded Successfully");
            iframe.contentWindow.focus();
        };

        // ป้องกันอาการหน้าขาวหรือค้าง (Fallback)
        setTimeout(() => {
            if (!iframe.src) {
                iframe.src = iframe.src;
            }
        }, 3000);
    </script>
</body>
</html>
